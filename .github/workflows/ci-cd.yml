name: CI/CD Pipeline

'on':
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MIN_COVERAGE_PCT: ${{ vars.MIN_COVERAGE_PCT || '90.0' }}
  MAX_IMAGE_SIZE_MB: ${{ vars.MAX_IMAGE_SIZE_MB || '25' }}
  CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME || 'catalog-db' }}
  CF_API_PROJECT_NAME: ${{ vars.CF_API_PROJECT_NAME || 'supplier-catalog-api' }}
  CF_FRONTEND_PROJECT_NAME: ${{ vars.CF_FRONTEND_PROJECT_NAME || 'supplier-catalog-frontend' }}
  VITE_API_URL: ${{ vars.VITE_API_URL || format('https://{0}.pages.dev', vars.CF_API_PROJECT_NAME || 'supplier-catalog-api') }}

jobs:
  # ============================================================================
  # 1. SECURITY & LINT GATES
  # ============================================================================
  security-and-lint:
    name: Security & Lint Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Verify Go Formatting & Static Analysis
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::The following Go files are not formatted according to gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi
          go vet ./...

  # ============================================================================
  # 2. TEST RIGOR & COVERAGE ENFORCEMENT GATE
  # ============================================================================
  test-and-coverage:
    name: Test Rigor & Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Execute Multi-Iteration Race Tests
        run: go test -v -race -count=5 ./...

      - name: Generate Coverage Profile & Enforce Threshold
        run: |
          go test -v -coverprofile=coverage.out -covermode=atomic -coverpkg=./pkg/... ./...
          ./scripts/check-coverage.sh coverage.out "${MIN_COVERAGE_PCT}"
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
          retention-days: 14

  # ============================================================================
  # 3. DOCKER BUILD, SIZE ASSERTION & GHCR PUBLISH
  # ============================================================================
  build-and-package:
    name: Docker Build & GHCR Publish
    runs-on: ubuntu-latest
    needs: [security-and-lint, test-and-coverage]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag

      - name: Log in to GitHub Container Registry (GHCR)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image for Validation
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ github.event.repository.name }}:validation
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert Docker Image Size Limit
        env:
          IMAGE_TAG: ${{ github.event.repository.name }}:validation
        run: |
          SIZE_BYTES=$(docker image inspect "${IMAGE_TAG}" --format='{{.Size}}')
          MAX_BYTES=$((MAX_IMAGE_SIZE_MB * 1024 * 1024))
          SIZE_MB=$(awk -v b="$SIZE_BYTES" 'BEGIN { printf("%.2f", b / (1024 * 1024)) }')
          echo "Evaluated Docker Image Size: ${SIZE_MB} MB (${SIZE_BYTES} bytes)"
          if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
            echo "::error::Docker image size (${SIZE_MB} MB) exceeds maximum limit of ${MAX_IMAGE_SIZE_MB} MB!"
            exit 1
          fi

      - name: Publish Docker Image to GHCR
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # ============================================================================
  # 4. CONTINUOUS DEPLOYMENT (CLOUDFLARE NATIVE ACTIONS)
  # ============================================================================
  deploy-to-cloudflare:
    name: Deploy to Cloudflare (Pages + Worker + D1)
    runs-on: ubuntu-latest
    needs: [build-and-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: cloudflare-deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            worker/package-lock.json

      - name: Install Dependencies & Run Worker Tests
        run: |
          npm --prefix frontend ci
          npm --prefix worker ci
          npm --prefix worker test

      - name: Apply Cloudflare D1 Migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply ${{ env.CF_D1_DATABASE_NAME }} --remote

      - name: Bundle Backend Worker via Wrangler Action
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --dry-run --outdir worker/dist-pages
          postCommands: |
            cp worker/dist-pages/index.js worker/dist-pages/_worker.js
            rm -f worker/dist-pages/index.js*

      - name: Deploy Cloudflare Backend API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: pages deploy dist-pages --project-name ${{ env.CF_API_PROJECT_NAME }} --branch ${{ github.ref_name }}

      - name: Build & Deploy Cloudflare Pages (Frontend SPA)
        uses: cloudflare/wrangler-action@v3
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: npm --prefix frontend run build:pages
          command: pages deploy frontend/dist --project-name ${{ env.CF_FRONTEND_PROJECT_NAME }} --branch ${{ github.ref_name }}
