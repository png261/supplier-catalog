name: Verify PR Source Branch

'on':
  pull_request:
    branches:
      - main

jobs:
  verify-pr-source:
    name: Verify Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Source Branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          ALLOWED_SOURCE_BRANCH: ${{ vars.ALLOWED_PR_SOURCE_BRANCH || 'dev' }}
        run: |
          echo "Target branch: ${BASE_REF}"
          echo "Source branch: ${HEAD_REF}"
          if [ "${HEAD_REF}" != "${ALLOWED_SOURCE_BRANCH}" ]; then
            echo "::error::Pull requests targeting '${BASE_REF}' are only allowed from the '${ALLOWED_SOURCE_BRANCH}' branch (current: '${HEAD_REF}')."
            exit 1
          fi
          echo "Verified: Pull request originates from '${ALLOWED_SOURCE_BRANCH}'."
