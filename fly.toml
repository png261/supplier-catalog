# [DEPRECATED] fly.toml app configuration file
# This project has migrated to Cloudflare (Pages + Worker + D1 Database).
# See wrangler.toml and scripts/deploy_cloudflare.sh.

app = "supplier-catalog"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_PATH = "/app/data/catalog.db"
  DATA_DIR = "/app/data"
  SHOP_TTL = "1h"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "20s"
  method = "GET"
  timeout = "4s"
  path = "/api/jobs"

[mounts]
  source = "catalog_data"
  destination = "/app/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
